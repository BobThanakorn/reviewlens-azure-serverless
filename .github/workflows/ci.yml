name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive terraform
      - name: Validate every stack
        run: |
          for dir in terraform/bootstrap terraform/envs/dev; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --minimum-failure-severity=warning
      - name: Checkov (own virtualenv, see requirements-checkov.txt)
        run: |
          python -m venv .venv-checkov
          .venv-checkov/bin/pip install -r requirements-checkov.txt
          .venv-checkov/bin/checkov -d terraform --framework terraform --quiet --compact

  plan:
    name: Terraform plan
    needs: [python, terraform]
    # Fork PRs get neither OIDC tokens nor secrets, so the plan only runs for same-repo PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for azure/login
      contents: read
      pull-requests: write # post the plan summary
    env:
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_classifier_provider: ${{ vars.CLASSIFIER_PROVIDER || 'openai' }}
      TF_VAR_enable_budget: ${{ vars.ENABLE_BUDGET || 'false' }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_data_admin_object_ids: ${{ secrets.DATA_ADMIN_OBJECT_IDS || '[]' }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Init
        working-directory: terraform/envs/dev
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
      - name: Plan (read-only identity, so no state lock)
        id: plan
        working-directory: terraform/envs/dev
        run: |
          set -o pipefail
          terraform plan -lock=false -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
      - name: Comment the plan on the PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const file = 'terraform/envs/dev/plan.txt';
            // The repository is public: mask GUIDs (subscription, tenant, object ids) in the comment.
            const guid = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi;
            const raw = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '(no plan output)';
            const text = raw.replace(guid, '<id>');
            const summary = (text.match(/^(Plan:.*|No changes\..*)$/m) || ['(see details)'])[0];
            const status = '${{ steps.plan.outcome }}' === 'success' ? 'succeeded' : 'FAILED';
            const body = [
              '<!-- terraform-plan -->',
              `### Terraform plan ${status}`,
              `**${summary}**`,
              '<details><summary>Full plan</summary>',
              '',
              '```',
              text.slice(0, 60000),
              '```',
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes('<!-- terraform-plan -->'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
