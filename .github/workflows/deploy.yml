name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_backfill_days:
        description: "Chunks the smoke test ingests (0 = skip backfill, 1-10)"
        required: false
        default: "3"

permissions:
  contents: read

# One deployment at a time; never cancel one that is half-way through an apply.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    name: Same checks as CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive terraform
      - name: Validate every stack
        run: |
          for dir in terraform/bootstrap terraform/envs/dev; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --minimum-failure-severity=warning
      - name: Checkov (own virtualenv)
        run: |
          python -m venv .venv-checkov
          .venv-checkov/bin/pip install -r requirements-checkov.txt
          .venv-checkov/bin/checkov -d terraform --framework terraform --quiet --compact

  deploy:
    name: Apply, publish, smoke test
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_classifier_provider: ${{ vars.CLASSIFIER_PROVIDER || 'language' }}
      TF_VAR_enable_budget: ${{ vars.ENABLE_BUDGET || 'false' }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_data_admin_object_ids: ${{ secrets.DATA_ADMIN_OBJECT_IDS || '[]' }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_APPLY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Terraform init
        working-directory: terraform/envs/dev
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
      - name: Terraform apply
        working-directory: terraform/envs/dev
        run: terraform apply -input=false -auto-approve

      # Terraform also renders web/config.js (git-ignored) with the API URL; it is uploaded below.
      - name: Publish Function Apps and dashboard
        run: python scripts/deploy_functions.py --with-web

      - name: Smoke test
        env:
          SMOKE_DAYS: ${{ github.event.inputs.smoke_backfill_days || vars.SMOKE_BACKFILL_DAYS || '3' }}
        run: python scripts/smoke_test.py --days "$SMOKE_DAYS"
